name: a3-harness-smoke
on: [pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get install -y zsh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Harness runs with no network: a fresh net namespace with only loopback up. Local fixtures only.
      - name: Harness smoke (network none)
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && ! curl -s -m 3 https://example.com >/dev/null && \
            setpriv --reuid=$(id -u runner) --regid=$(id -g runner) --init-groups env HOME=$HOME PATH=$PATH \
            sh -c "node --experimental-strip-types harness/a3-local/run.ts $RUNNER_TEMP/a3 && node --experimental-strip-types harness/a3-local/score.ts $RUNNER_TEMP/a3"'
      - name: Safety regression (no Docker on CI; container test skips)
        run: node --experimental-strip-types --test harness/a3-local/tests/safety.test.ts
