# NOTE: this workflow has NEVER run on hosted CI (no push has been made). Its only validation is the
# local SIMULATION described in harness/a3-local/ci/README.md. Treat it as unverified until a real run exists.
name: a3-harness-smoke
on: [pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Harness runs with no network: a fresh net namespace with only loopback up. Local fixtures only.
      # All values are expanded by the runner shell and passed as arguments, so sudo's env_reset does not matter.
      - name: Harness smoke (network none)
        run: |
          set -e; NODE="$(command -v node)"; OUT="$RUNNER_TEMP/a3"
          sudo unshare --net -- sh -c 'ip link set lo up && ! getent hosts example.com >/dev/null && exec "$@"' sh \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env -i HOME="$HOME" PATH="$(dirname "$NODE"):/usr/bin:/bin" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            sh -c "\"$NODE\" --experimental-strip-types harness/a3-local/run.ts \"$OUT\" && \"$NODE\" --experimental-strip-types harness/a3-local/score.ts \"$OUT\""
      # Unit + safety + runner suites. Docker-image-dependent tests report as skipped on CI (images are local-only).
      - name: All test suites
        run: npm run test:all
  # M3 (D-41): build the local-only images ON the hosted runner so the Stage A Docker isolation tests run there.
  # Exact docker commands are below. No --privileged and no --cap-add anywhere in this job: run.sh's containers use
  # --cap-drop ALL, --network none, --read-only, no-new-privileges. (Only the LOCAL CI simulation's outer container
  # adds SYS_ADMIN + NET_ADMIN, for `unshare --net`; this job does not need them.) Base image pinned by digest;
  # actions pinned by commit; token read-only. The build step has network (apt/npm, as in Dockerfile.browser-pilot);
  # the test containers never do.
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npm ci
      - name: Build local images (pinned base digest, never published)
        run: |
          set -eux
          BASE=node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
          docker pull "$BASE"
          docker tag "$BASE" node:24-bookworm-slim
          docker build --pull=false -f Dockerfile.browser-pilot -t rove-browser-pilot:local .
          docker image inspect -f '{{.Id}} {{.RepoTags}}' rove-browser-pilot:local node:24-bookworm-slim
      - name: Stage A runner suite incl. Docker isolation tests
        run: npm run test:stage-a-runner
